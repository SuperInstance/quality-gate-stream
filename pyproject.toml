[project]
name = "quality-gate-stream"
version = "0.1.1"
description = "Streaming quality gates — continuous quality scoring for data streams, agent outputs, and pipeline results"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Oracle1" },
]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quality_gate*", "quartermaster_gc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
